<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#087f8c"><title>Itacaré HPS</title><link rel="manifest" href="manifest.webmanifest"><style>body{margin:0;background:#eef7f6;font:16px system-ui;color:#14363c}header{background:linear-gradient(135deg,#087f8c,#10b981);color:white;padding:32px 20px 24px;border-radius:0 0 25px 25px}h1{margin:0;font-size:35px}header p{margin:8px 0}main{padding:16px;max-width:720px;margin:auto}nav{display:flex;gap:8px;overflow:auto;padding:12px 16px;background:white;position:sticky;top:0}nav button{border:0;border-radius:20px;padding:11px 14px;white-space:nowrap;background:#e3f5f2;color:#075a65;font-weight:700}nav button.active{background:#087f8c;color:white}.card{background:white;border-radius:17px;padding:18px;margin:12px 0;box-shadow:0 2px 12px #064c5114}h2{margin:0 0 12px;font-size:23px}h3{margin:0 0 6px}.muted{color:#58747a;font-size:14px}a{color:#087f8c;font-weight:700}.pill{display:inline-block;padding:5px 9px;background:#e5f6f3;border-radius:14px;margin:3px;font-size:13px}input{width:90px;padding:8px;border:1px solid #bed6d7;border-radius:8px}button.action{padding:9px 13px;border:0;border-radius:12px;background:#087f8c;color:white}footer{padding:30px;text-align:center;color:#58747a}section{display:none}section.show{display:block}</style></head><body><header><h1>🌴 Itacaré HPS</h1><p>Brumado → Itacaré • 27/12/2026 a 02/01/2027</p><strong>Seu guia de viagem no iPhone</strong></header><nav id="nav"></nav><main id="main"></main><footer>Itacaré HPS • Informações sujeitas a confirmação. Consulte horários, preços e condições locais.</footer><script>
const tabs=[['roteiro','🗓️ Roteiro'],['praias','🏖️ Praias'],['hoteis','🛏️ Hotéis'],['comida','🍽️ Restaurantes'],['postos','⛽ Postos'],['passeios','🌿 Passeios'],['carro','🚗 Carro'],['custos','💰 Custos']];
const roteiro=[['27/12','Brumado → Itacaré','Saída sugerida às 6h; chegada à tarde, check-in e Praia da Concha.'],['28/12','Praias urbanas','Resende, Tiririca, Costa e Ribeira. À noite, Rua da Pituba.'],['29/12','Quatro Praias','Engenhoca, Havaizinho, Camboinha e Itacarezinho.'],['30/12','Jeribucaçu','Trilha e encontro do rio com o mar; considere guia local.'],['31/12','Prainha e Réveillon','Trilha pela manhã; confirme programação da virada.'],['01/01','Descanso','Praia da Concha, piscina e gastronomia.'],['02/01','Retorno','Check-out e viagem de volta a Brumado.']];
const praias=[['Praia da Concha','Boa infraestrutura e mar geralmente mais calmo.'],['Prainha','Natureza preservada; acesso por trilha.'],['Jeribucaçu','Encontro de rio e mar; trilha.'],['Itacarezinho','Extensa faixa de areia e coqueiros.'],['Havaizinho','Praia cercada por vegetação.'],['Engenhoca','Praia e trilha, popular entre surfistas.'],['Resende','Praia urbana charmosa.'],['Tiririca','Praia conhecida pelo surfe.'],['Ribeira','Praia urbana com estrutura.']];
const hoteis=[['Aldeia do Mar Hotel','Região da Praia da Concha; consulte acesso à areia.'],['Pousada Abaré','Pousada na região da Concha.'],['Pousada Portal da Concha','Alternativa para comparar tarifas.'],['Conchas do Mar Residence','Apart-hotel para estadias mais longas.']];
const comida=[['Jiló Bar Restaurante','Jantar especial.'],['Lua Cheia Bar Cozinha','Opção no centro.'],['Coco Pimenta Gastrobar','Região da Praça Santos Dumont.'],['Cabana da Ximbica','Almoço na Praia da Concha.']];
const postos=[['Brumado','Abasteça antes de sair.'],['Jequié','Parada sugerida para combustível e descanso.'],['Ipiaú','Alternativa de abastecimento na rota.'],['Ubaitaba','Confira posto no caminho antes de seguir a Itacaré.'],['Itacaré','Abasteça antes dos passeios e da volta.']];
const passeios=[['Cachoeira de Tijuípe','Banho de água doce.'],['Rafting em Taboquinhas','Aventura no Rio de Contas.'],['Passeio de barco no Rio de Contas','Paisagens e manguezais.'],['Ponta do Xaréu','Pôr do sol.'],['Rua da Pituba','Restaurantes, lojas e passeio noturno.']];
const map=(s)=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s);
const card=(title,desc,query)=>'<article class="card"><h3>'+title+'</h3><p>'+desc+'</p><a target="_blank" rel="noopener" href="'+map(query)+'">📍 Abrir no Google Maps ↗</a></article>';
const list=(items,suffix)=>items.map(x=>card(x[0],x[1],x[0]+', '+suffix)).join('');
const sections={roteiro:'<h2>Roteiro dia a dia</h2><p class="muted">Distância aproximada: 400 km. Planeje 7–8 horas com paradas, conforme a rota e o trânsito.</p>'+roteiro.map(x=>card(x[0]+' • '+x[1],x[2],x[1].includes('Brumado')?'Brumado Bahia':'Itacaré Bahia')).join(''),praias:'<h2>Praias</h2>'+list(praias,'Itacaré BA'),hoteis:'<h2>Hospedagem</h2><p class="muted">Sugestões para cotação; tarifas e disponibilidade não confirmadas.</p>'+list(hoteis,'Itacaré BA'),comida:'<h2>Restaurantes</h2>'+list(comida,'Itacaré BA'),postos:'<h2>Postos e abastecimento</h2><p class="muted">Locais estratégicos, não estabelecimentos confirmados. Confira o posto escolhido e o desvio no mapa.</p>'+postos.map(x=>card('⛽ '+x[0],x[1],'posto de gasolina '+x[0]+' Bahia')).join(''),passeios:'<h2>Passeios e atividades</h2>'+list(passeios,'Itacaré BA'),carro:'<h2>Aluguel de carro</h2><article class="card"><p>Pesquise locadoras com retirada e devolução em Brumado. Confira seguro, quilometragem, combustível e condições para estradas não pavimentadas.</p><a href="'+map('locadora de carros Brumado Bahia')+'" target="_blank">Buscar locadoras ↗</a></article>',custos:'<h2>Estimativa de combustível</h2><article class="card"><p>Distância total (km) <input id="km" type="number" value="800"></p><p>Consumo (km/l) <input id="consumo" type="number" value="12"></p><p>Preço por litro (R$) <input id="preco" type="number" value="6.30" step=".01"></p><button class="action" onclick="calc()">Calcular</button><h3 id="total"></h3></article>'};
document.getElementById('nav').innerHTML=tabs.map(([id,label])=>'<button data-tab="'+id+'">'+label+'</button>').join('');
document.getElementById('main').innerHTML=tabs.map(([id])=>'<section id="'+id+'">'+sections[id]+'</section>').join('');
function show(id){document.querySelectorAll('section').forEach(e=>e.classList.toggle('show',e.id===id));document.querySelectorAll('nav button').forEach(e=>e.classList.toggle('active',e.dataset.tab===id));history.replaceState(null,'','#'+id)}document.querySelectorAll('nav button').forEach(e=>e.onclick=()=>show(e.dataset.tab));show(location.hash.slice(1) in sections?location.hash.slice(1):'roteiro');
function calc(){const a=+document.getElementById('km').value,b=+document.getElementById('consumo').value,c=+document.getElementById('preco').value;document.getElementById('total').textContent=b>0?'Total estimado: '+(a/b*c).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}):'Informe consumo válido'}</script></body></html>
