const tabs=[['roteiro','🗓️ Roteiro'],['praias','🏖️ Praias'],['hoteis','🛏️ Hotéis'],['comida','🍽️ Restaurantes'],['postos','⛽ Postos'],['passeios','🌿 Passeios'],['carro','🚗 Carro'],['custos','💰 Custos']];

const postos=[['Brumado','Abasteça antes de sair.'],['Jequié','Parada sugerida para combustível e descanso.'],['Ipiaú','Alternativa de abastecimento na rota.'],['Ubaitaba','Confira posto no caminho antes de seguir a Itacaré.'],['Itacaré','Abasteça antes dos passeios e da volta.']];

const photos={"Praia da Concha":"https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=900&q=80","Prainha":"https://images.unsplash.com/photo-1473116763249-2faaef81ccda?w=900&q=80","Jeribucaçu":"https://images.unsplash.com/photo-1510414842594-a61c69b5ae57?w=900&q=80","Itacarezinho":"https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=900&q=80","Havaizinho":"https://images.unsplash.com/photo-1519046904884-53103b34b206?w=900&q=80","Engenhoca":"https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=900&q=80","Resende":"https://images.unsplash.com/photo-1500375592092-40eb2168fd21?w=900&q=80","Tiririca":"https://images.unsplash.com/photo-1455729552865-3658a5d7f9d7?w=900&q=80","Ribeira":"https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?w=900&q=80","default":"https://images.unsplash.com/photo-1500534623283-312aade485b7?w=900&q=80"};const map=(s)=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s);
const card=(title,desc,query)=>'<article class="card">'+(photoFor(title)?'<img loading="lazy" alt="Foto ilustrativa de paisagem para '+title+'" src="'+photoFor(title)+'">':'')+'<div class="content"><h3>'+title+'</h3><p>'+desc+'</p><a class="maplink" target="_blank" rel="noopener" href="'+map(query)+'">📍 Ver no Google Maps ↗</a></div></article>'; const photoFor=(title)=>{const k=Object.keys(photos).find(k=>k!=='default'&&title.toLowerCase().includes(k.toLowerCase()));return k?photos[k]:(title.includes('Hotel')||title.includes('Pousada')||title.includes('Residence')?photos.default:'')};
const list=(items,suffix)=>items.map(x=>card(x[0],x[1],x[0]+', '+suffix)).join('');
const sections={roteiro:'<h2>Roteiro dia a dia</h2><div class="route-banner"><h3>🚗 Brumado → Itacaré</h3><div class="route-steps"><span>Brumado</span><span>Jequié</span><span>Ipiaú</span><span>Itacaré</span></div><p class="muted">O Google Maps pode ajustar o caminho conforme as condições de trânsito. Confirme o percurso antes de sair.</p><a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&origin=Brumado%2C%20BA&destination=Itacar%C3%A9%2C%20BA&travelmode=driving&waypoints=Jequi%C3%A9%2C%20BA%7CIpia%C3%BA%2C%20BA">🗺️ Abrir rota completa no mapa ↗</a></div><p class="muted">Distância aproximada: 400 km. Planeje 7–8 horas com paradas, conforme a rota e o trânsito.</p>'+roteiro.map(x=>card(x[0]+' • '+x[1],x[2],x[1].includes('Brumado')?'Brumado Bahia':'Itacaré Bahia')).join(''),praias:'<h2>Praias</h2>'+list(praias,'Itacaré BA'),hoteis:'<h2>Hospedagem</h2><p class="muted">Sugestões para cotação; tarifas e disponibilidade não confirmadas.</p>'+list(hoteis,'Itacaré BA'),comida:'<h2>Restaurantes</h2>'+list(comida,'Itacaré BA'),postos:'<h2>Postos e abastecimento</h2><div class="route-banner"><h3>⛽ Planeje as paradas</h3><p>Confira postos disponíveis ao longo do percurso e use o mapa para escolher onde abastecer.</p><a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&origin=Brumado%2C%20BA&destination=Itacar%C3%A9%2C%20BA&travelmode=driving&waypoints=Jequi%C3%A9%2C%20BA%7CIpia%C3%BA%2C%20BA">🗺️ Ver trajeto com paradas ↗</a></div><p class="muted">Locais estratégicos, não estabelecimentos confirmados. Confira o posto escolhido e o desvio no mapa.</p>'+postos.map(x=>card('⛽ '+x[0],x[1],'posto de gasolina '+x[0]+' Bahia')).join(''),passeios:'<h2>Passeios e atividades</h2>'+list(passeios,'Itacaré BA'),carro:'<h2>Aluguel de carro</h2><article class="card"><p>Pesquise locadoras com retirada e devolução em Brumado. Confira seguro, quilometragem, combustível e condições para estradas não pavimentadas.</p><a href="'+map('locadora de carros Brumado Bahia')+'" target="_blank">Buscar locadoras ↗</a></article>',custos:'<h2>Estimativa de combustível</h2><article class="card"><p>Distância total (km) <input id="km" type="number" value="800"></p><p>Consumo (km/l) <input id="consumo" type="number" value="12"></p><p>Preço por litro (R$) <input id="preco" type="number" value="6.30" step=".01"></p><button class="action" onclick="calc()">Calcular</button><h3 id="total"></h3></article>'};
document.getElementById('nav').innerHTML=tabs.map(([id,label])=>'<button data-tab="'+id+'">'+label+'</button>').join('');
document.getElementById('main').innerHTML=tabs.map(([id])=>'<section id="'+id+'">'+sections[id]+'</section>').join('');
function show(id){document.querySelectorAll('section').forEach(e=>e.classList.toggle('show',e.id===id));document.querySelectorAll('nav button').forEach(e=>e.classList.toggle('active',e.dataset.tab===id));history.replaceState(null,'','#'+id)}document.querySelectorAll('nav button').forEach(e=>e.onclick=()=>show(e.dataset.tab));show(location.hash.slice(1) in sections?location.hash.slice(1):'roteiro');
function calc(){const a=+document.getElementById('km').value,b=+document.getElementById('consumo').value,c=+document.getElementById('preco').value;document.getElementById('total').textContent=b>0?'Total estimado: '+(a/b*c).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}):'Informe consumo válido'}</script></body></html>
